<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>stephanie</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');

:root{
    --bg-1: #171b26;
    --bg-2: #1f2433;
    --bg-3: #262c3d;
    --card: rgba(23, 27, 38, 0.72);
    --primary: #7c93b8;
    --secondary: #4a5568;
    --accent: #566079;
    --mist: rgba(124, 147, 184, 0.15);
    --text: #a8b2c4;
    --text-dim: #6b7488;
    --text-bright: #d8dee9;
    --shadow: 0 30px 60px rgba(0, 0, 0, 0.45);
    --radius: 18px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(86, 96, 121, 0.25), transparent),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
}

/* Rain */
.rain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
}
.drop {
    position: absolute;
    top: -10%;
    width: 1px;
    background: linear-gradient(180deg, transparent, rgba(168, 178, 196, 0.35));
    animation: fall linear infinite;
}
@keyframes fall {
    0% { transform: translateY(0); opacity: 0; }
    8% { opacity: 1; }
    100% { transform: translateY(115vh); opacity: 0.2; }
}

/* Faint vignette fog drifting */
.fog {
    position: fixed;
    inset: -10%;
    background: radial-gradient(ellipse 60% 40% at 20% 80%, rgba(86,96,121,0.12), transparent 60%),
                radial-gradient(ellipse 50% 35% at 85% 15%, rgba(86,96,121,0.10), transparent 60%);
    pointer-events: none;
    z-index: 1;
    animation: drift 22s ease-in-out infinite alternate;
}
@keyframes drift {
    0% { transform: translate(0,0); }
    100% { transform: translate(2%, -2%); }
}

.container {
    width: 100%;
    max-width: 460px;
    z-index: 10;
    position: relative;
}
.card {
    background: var(--card);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(168, 178, 196, 0.12);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 40px 34px;
    text-align: center;
    position: relative;
    animation: cardIn 1s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes cardIn {
    0% { transform: translateY(16px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
}

.icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 35% 30%, rgba(124,147,184,0.25), rgba(86,96,121,0.05));
    border: 1px solid rgba(168, 178, 196, 0.18);
    position: relative;
}
.icon::before {
    content: '😔';
    font-size: 26px;
    filter: grayscale(35%) opacity(0.9);
    animation: sway 4s ease-in-out infinite;
}
@keyframes sway {
    0%, 100% { transform: rotate(-4deg); }
    50% { transform: rotate(4deg); }
}

.eyebrow {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0 0 14px 0;
    font-weight: 500;
}

.title {
    font-family: 'Crimson Pro', serif;
    font-size: 26px;
    font-weight: 500;
    font-style: italic;
    color: var(--text-bright);
    margin: 0 0 16px 0;
    line-height: 1.45;
    letter-spacing: 0.2px;
}

.subtitle {
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 400;
    margin: 0 0 36px 0;
    line-height: 1.6;
    font-style: italic;
}

.divider {
    width: 40px;
    height: 1px;
    background: rgba(168, 178, 196, 0.25);
    margin: 0 auto 36px;
}

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 20px;
}
.btn {
    border: none;
    border-radius: 10px;
    padding: 15px 22px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: all 0.35s ease;
}
.btn-primary {
    background: linear-gradient(160deg, #4a5568, #333b4d);
    color: var(--text-bright);
    border: 1px solid rgba(168, 178, 196, 0.15);
}
.btn-secondary {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid rgba(168, 178, 196, 0.15);
}
.btn:hover {
    transform: translateY(-1px);
    border-color: rgba(168, 178, 196, 0.35);
    color: var(--text-bright);
}
.btn:active { transform: translateY(0); }

.footer {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 400;
    font-style: italic;
    letter-spacing: 0.3px;
}

@media (max-width: 640px) {
    .card { padding: 32px 24px; }
    .title { font-size: 22px; }
    .actions { grid-template-columns: 1fr; }
}

.overlay {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(23, 27, 38, 0.92);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(168, 178, 196, 0.15);
    padding: 28px 32px;
    border-radius: 16px;
    box-shadow: var(--shadow);
    z-index: 1000;
    animation: overlayIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    text-align: center;
}
@keyframes overlayIn {
    0% { transform: translate(-50%, -50%) scale(0.92); opacity: 0; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}
</style>
</head>
<body>
<div class="fog"></div>
<div class="rain" id="rain"></div>

<div class="container">
  <div class="card">
    <div class="icon"></div>
    <p class="eyebrow">GAIS PALIMOS LANG</p>
    <h1 class="title" id="mainTitle">hi gais baka may 500 kayo dyan &mdash; diba mabait naman kayo eh baka meron kayo dyan :(</h1>
    <p class="subtitle"> mayaman ka naman kayo HAHAHAHAHAHA eh .</p>
    <div class="divider"></div>

    <div class="actions">
      <form name="date-responses" method="POST" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="response" value="meron - yes salamat sana maging mayaman kapa lalo 😁" />
        <input type="hidden" name="timestamp" value="" />
        <input type="hidden" name="user-agent" value="" />
        <button type="submit" class="btn btn-primary" onclick="fillMeta(this.form)">yes</button>
      </form>

      <form name="date-responses" method="POST" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="response" value="wala - ay wala sayang naman ipang lilibre ko pa naman sayo yon 😢" />
        <input type="hidden" name="timestamp" value="" />
        <input type="hidden" name="user-agent" value="" />
        <button type="submit" class="btn btn-secondary" onclick="fillMeta(this.form)">no</button>
      </form>
    </div>

    <div class="footer">sa mabait niyong kaibigan jairus 😁</div>
  </div>
</div>

<script>
function fillMeta(form) {
  form.querySelector('[name="timestamp"]').value = new Date().toISOString();
  form.querySelector('[name="user-agent"]').value = navigator.userAgent;
}

// Rain generation
function createDrop() {
  const rain = document.getElementById('rain');
  const drop = document.createElement('div');
  drop.className = 'drop';
  const left = Math.random() * 100;
  const duration = 1.4 + Math.random() * 1.4;
  const height = 40 + Math.random() * 60;
  drop.style.left = left + '%';
  drop.style.height = height + 'px';
  drop.style.animationDuration = duration + 's';
  rain.appendChild(drop);
  setTimeout(() => { if (drop.parentNode) drop.parentNode.removeChild(drop); }, duration * 1000 + 200);
}
setInterval(createDrop, 90);
for (let i = 0; i < 30; i++) setTimeout(createDrop, i * 40);

function showOverlay(icon, headline, message) {
  const el = document.createElement('div');
  el.className = 'overlay';
  el.innerHTML = `<div style="font-size: 30px; margin-bottom: 12px; opacity:0.85;">${icon}</div>
    <div style="font-family:'Crimson Pro',serif; font-style:italic; font-weight:500; color:#d8dee9; margin-bottom: 8px; font-size:17px;">${headline}</div>
    <div style="color:#6b7488; font-size: 13px;">${message}</div>`;
  document.body.appendChild(el);
  setTimeout(() => { el.remove(); }, 3200);
}

function fakeQrSvg() {
  // Purely decorative "QR code" pattern for the prank — not a real, scannable code.
  let cells = '';
  const size = 21;
  const cell = 8;
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      const inFinder =
        (r < 7 && c < 7) || (r < 7 && c > size - 8) || (r > size - 8 && c < 7);
      if (inFinder) continue;
      if (Math.random() > 0.55) {
        cells += `<rect x="${c * cell}" y="${r * cell}" width="${cell}" height="${cell}" fill="#1f2433"/>`;
      }
    }
  }
  function finder(x, y) {
    return `
      <rect x="${x}" y="${y}" width="${7*cell}" height="${7*cell}" fill="#1f2433"/>
      <rect x="${x+cell}" y="${y+cell}" width="${5*cell}" height="${5*cell}" fill="#fff"/>
      <rect x="${x+2*cell}" y="${y+2*cell}" width="${3*cell}" height="${3*cell}" fill="#1f2433"/>
    `;
  }
  const total = size * cell;
  return `<svg width="150" height="150" viewBox="0 0 ${total} ${total}" xmlns="http://www.w3.org/2000/svg" style="background:#fff; border-radius:8px;">
    <rect width="${total}" height="${total}" fill="#fff"/>
    ${cells}
    ${finder(0, 0)}
    ${finder((size-7)*cell, 0)}
    ${finder(0, (size-7)*cell)}
  </svg>`;
}

document.addEventListener("submit", function (e) {
  if (e.target.name === "date-responses") {
    e.preventDefault();
    const form = e.target;
    const resp = form.querySelector('[name="response"]').value;

    // Submit to Netlify in the background (works once deployed on Netlify;
    // harmlessly no-ops if not, so the popup below always shows regardless).
    const formData = new FormData(form);
    fetch("/", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams(formData).toString()
    }).catch(() => {});

    if (resp.startsWith("MERON")) {
      const el = document.createElement('div');
      el.className = 'overlay';
      el.innerHTML = `<div style="font-size: 30px; margin-bottom: 12px; opacity:0.85;">😘</div>
        <div style="font-family:'Crimson Pro',serif; font-style:italic; font-weight:500; color:#d8dee9; margin-bottom: 12px; font-size:17px;">NAKS NAPAKA BAIT NIYO TALAGA.</div>
        <div style="display:flex; justify-content:center; margin-bottom: 10px;">${fakeQrSvg()}</div>
        <div style="color:#6b7488; font-size: 12px;">scan mo raw daw 😅</div>`;
      document.body.appendChild(el);
      setTimeout(() => { el.remove(); }, 5000);
    } else {
      showOverlay('😭', 'NAKS NAPAKA BAIT NIYO TALAGA.');
    }
  }
});

// URL params (kept for compatibility)
(function() {
  const params = new URLSearchParams(location.search);
  const title = params.get('title');
  if (title) document.getElementById('mainTitle').textContent = decodeURIComponent(title);
})();
</script>
</body>
</html>
